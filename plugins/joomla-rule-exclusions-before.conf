# OWASP CRS Plugin
# Plugin name: joomla-rule-exclusions
# Plugin description: Rule exclusions for the Joomla administrator back end
# Rule ID block base: 9,532,000 - 9,532,999
# Plugin version: 0.1.0

# Documentation can be found here:
# https://github.com/futsure0/joomla-rule-exclusions-plugin

# Generic rule to disable plugin
SecRule TX:joomla-rule-exclusions-plugin_enabled "@eq 0" "id:9532099,phase:1,pass,nolog,ctl:ruleRemoveById=9532100-9532999"

# Default installation path
SecRule &TX:joomla-rule-exclusions-plugin_path "@eq 0" \
    "id:9532090,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'joomla-rule-exclusions-plugin/0.1.0',\
    setvar:'tx.joomla-rule-exclusions-plugin_path=/'"


# -=[ Administrator back end ]=-
#
# The exclusions below only apply to POST requests to the administrator entry
# point that carry a Joomla session cookie. Joomla names its session cookies
# with a 32 character hexadecimal hash and uses session IDs made of lowercase
# letters and digits. The cookie is not a security boundary (Joomla itself
# checks the session and the CSRF token); it only narrows the exclusions to
# requests that look like a logged-in editor saving content.
#
# Only the content fields of the editor screens are excluded, and only from
# the XSS rules (tag attack-xss) and from rule 932130, which matches
# ">(" in ordinary HTML text (for example "<strong>Note</strong>(see below)")
# as a Unix process substitution. All other fields and all other rules stay
# active.

SecRule REQUEST_FILENAME "@streq %{tx.joomla-rule-exclusions-plugin_path}administrator/index.php" \
    "id:9532100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'joomla-rule-exclusions-plugin/0.1.0',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule REQUEST_COOKIES:/^[0-9a-f]{32}$/ "@rx ^[a-z0-9,-]{22,128}$" \
            "t:none,\
            setvar:'tx.joomla-rule-exclusions-plugin_admin_post=1'"

# [ Articles ]
SecRule TX:joomla-rule-exclusions-plugin_admin_post "@eq 1" \
    "id:9532110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'joomla-rule-exclusions-plugin/0.1.0',\
    chain"
    SecRule ARGS_GET:option "@streq com_content" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:jform[articletext],\
        ctl:ruleRemoveTargetById=932130;ARGS:jform[articletext]"

# [ Modules (custom HTML) ]
SecRule TX:joomla-rule-exclusions-plugin_admin_post "@eq 1" \
    "id:9532120,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'joomla-rule-exclusions-plugin/0.1.0',\
    chain"
    SecRule ARGS_GET:option "@streq com_modules" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:jform[content],\
        ctl:ruleRemoveTargetById=932130;ARGS:jform[content]"

# [ Categories ]
SecRule TX:joomla-rule-exclusions-plugin_admin_post "@eq 1" \
    "id:9532130,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'joomla-rule-exclusions-plugin/0.1.0',\
    chain"
    SecRule ARGS_GET:option "@streq com_categories" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:jform[description],\
        ctl:ruleRemoveTargetById=932130;ARGS:jform[description]"

# [ Global configuration: offline message ]
SecRule TX:joomla-rule-exclusions-plugin_admin_post "@eq 1" \
    "id:9532140,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'joomla-rule-exclusions-plugin/0.1.0',\
    chain"
    SecRule ARGS_GET:option "@streq com_config" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:jform[offline_message],\
        ctl:ruleRemoveTargetById=932130;ARGS:jform[offline_message]"
