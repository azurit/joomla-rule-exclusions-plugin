# OWASP CRS Plugin
# Plugin name: joomla-rule-exclusions
# Plugin description: Rule exclusions for the Joomla administrator back end
# Rule ID block base: 9,532,000 - 9,532,999
# Plugin version: 0.1.0

# Generic rule to disable the plugin
#
# Plugins are enabled by default.
#
# They become active by placing them in the plugin folder. It is possible to
# control plugin activation via setting a variable. This can be done in the
# plugin config file here.
#
# The predefined variable name is meant to be "<plugin name>-plugin_enabled".
# For the joomla-rule-exclusions-plugin, this means it can be disabled by
# setting tx.joomla-rule-exclusions-plugin_enabled=0.
#
# Note that a global setting of this variable overrides the setting here.
# That means the "enabled" variable is only set by this rule if it has not
# been set before.
#
# Feel free to set the variable unconditionally here by replacing the
# SecRule line with an unconditional SecAction statement.
#
#SecRule &TX:joomla-rule-exclusions-plugin_enabled "@eq 0" \
#    "id:9532010,\
#    phase:1,\
#    pass,\
#    nolog,\
#    ver:'joomla-rule-exclusions-plugin/0.1.0',\
#    setvar:'tx.joomla-rule-exclusions-plugin_enabled=0'"

# Joomla installation path (optional)
#
# The path prefix under which Joomla is installed. It must start and end with
# "/". The administrator entry point is expected at
# "<path>administrator/index.php". The default is "/".
#
# Set it unconditionally:
#
#SecAction \
#    "id:9532020,\
#    phase:1,\
#    pass,\
#    nolog,\
#    ver:'joomla-rule-exclusions-plugin/0.1.0',\
#    setvar:'tx.joomla-rule-exclusions-plugin_path=/cms/'"
#
# or per host, when several sites share one configuration:
#
#SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?example\.com(?::[0-9]+)?$" \
#    "id:9532021,\
#    phase:1,\
#    pass,\
#    t:none,t:lowercase,\
#    nolog,\
#    ver:'joomla-rule-exclusions-plugin/0.1.0',\
#    setvar:'tx.joomla-rule-exclusions-plugin_path=/cms/'"
#
# To use the plugin only on some hosts, disable it by default and enable it
# per host with tx.joomla-rule-exclusions-plugin_enabled. See "Conditionally
# enable plugins for multi-application environments" in the CRS documentation.
